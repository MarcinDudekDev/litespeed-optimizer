# CI Pipeline for litespeed-optimizer
# Runs on push/PR to main: shellcheck, syntax check, full test suite,
# Docker E2E against a real OpenLiteSpeed container.
# The heavy WordPress+WooCommerce E2E (tests/e2e-woo.sh) is manual-trigger only.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_woo_e2e:
        description: "Run the heavy WordPress+WooCommerce E2E"
        type: boolean
        default: false

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck (errors)
        run: shellcheck --severity=error litespeed-optimizer.sh litespeed-optimizer-lib/*.sh lib/registry.sh lib/core/*.sh lib/features/*.sh

      - name: Run shellcheck (warnings)
        run: shellcheck --severity=warning litespeed-optimizer.sh litespeed-optimizer-lib/*.sh lib/registry.sh lib/core/*.sh lib/features/*.sh

  syntax-check:
    name: Bash Syntax (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Show bash version
        run: bash --version | head -1

      - name: Check bash syntax - main script
        run: bash -n litespeed-optimizer.sh

      - name: Check bash syntax - all libraries
        run: |
          for f in litespeed-optimizer-lib/*.sh lib/registry.sh lib/core/*.sh lib/features/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: Check bash syntax - test scripts
        run: |
          bash -n tests/run-tests.sh
          bash -n tests/test-with-ols-docker.sh
          bash -n tests/e2e-woo.sh

  test:
    name: Test Suite (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: [shellcheck, syntax-check]
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y shellcheck

      - name: Install shellcheck (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install shellcheck

      - name: Run test suite
        run: ./tests/run-tests.sh

      - name: Test --version output
        run: |
          version=$(./litespeed-optimizer.sh --version 2>&1)
          echo "Version: $version"
          expected=$(grep -m1 '^VERSION=' litespeed-optimizer.sh | cut -d'"' -f2)
          echo "$version" | grep -q "$expected" || exit 1

      - name: Test help command
        run: ./litespeed-optimizer.sh help | grep -q "COMMANDS:"

      - name: Test detect on fixture
        run: LSO_FS_ROOT=tests/configs/plain-ols ./litespeed-optimizer.sh detect --json | grep -q '"edition"'

      - name: Test --no-color flag
        run: |
          output=$(./litespeed-optimizer.sh --no-color --version 2>&1 | cat -v)
          if echo "$output" | grep -q '\[0;'; then echo "FAIL: escape codes found in --no-color output"; exit 1; fi

  portability:
    name: Portability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for GNU-only / bash-4+ constructs
        run: |
          echo "Checking for find -printf..."
          ! grep -r "find.*-printf" lib/ litespeed-optimizer-lib/ litespeed-optimizer.sh

          echo "Checking for declare -A..."
          ! grep -r "declare -A" lib/ litespeed-optimizer-lib/ litespeed-optimizer.sh

          echo "Checking for flock..."
          ! grep -rw "flock" litespeed-optimizer.sh lib/ litespeed-optimizer-lib/ | grep -v "#"

          echo "All portability checks passed!"

  docker-e2e:
    name: Docker E2E (OpenLiteSpeed)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Run E2E against real OLS container
        run: ./tests/test-with-ols-docker.sh

  woo-e2e:
    name: WordPress+WooCommerce E2E (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_woo_e2e
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Run full WP+Woo E2E
        run: ./tests/e2e-woo.sh

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: docs/E2E-REPORT.md
