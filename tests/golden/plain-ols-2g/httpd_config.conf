#
# PLAIN-TEXT CONFIGURATION FILE
# OpenLiteSpeed fixture — plain install, no panel
#
serverName                example-server
user                      nobody
group                     nogroup
priority                  0
autoRestart               1
chrootPath                /
enableChroot              0
inMemBufSize              60M
swappingDir               /tmp/lshttpd/swap
autoFix503                1
gracefulRestartTimeout    300
mime                      conf/mime.properties
showVersionNumber         0
adminEmails               root@localhost

errorlog logs/error.log {
  logLevel                DEBUG
  debugLevel              0
  rollingSize             10M
  enableStderrLog         1
}

accesslog logs/access.log {
  rollingSize             10M
  keepDays                30
  compressArchive         0
}

indexFiles                index.html, index.php

expires {
  enableExpires           1
  expiresByType           image/*=A604800,text/css=A604800,application/x-javascript=A604800
}

tuning {
  maxConnections                 5000
  maxSSLConnections       1000
  connTimeout                    45
  maxKeepAliveReq                1000
  keepAliveTimeout               5
  sndBufSize                     0
  rcvBufSize                     0
  maxReqURLLen            32768
  maxReqHeaderSize        65536
  maxReqBodySize          2047M
  maxDynRespHeaderSize    32768
  maxDynRespSize          2047M
  maxCachedFileSize              4096
  totalInMemCacheSize            40M
  maxMMapFileSize                256K
  totalMMapCacheSize             80M
  useSendfile                    1
  fileETag                28
  enableGzipCompress             1
  compressibleTypes       default
  enableDynGzipCompress          1
  gzipCompressLevel              6
  enableBr                       1
  brStaticCompressLevel          2
  gzipAutoUpdateStatic           1
}

fileAccessControl {
  followSymbolLink        1
  checkSymbolLink         0
  requiredPermissionMask  000
  restrictedPermissionMask 000
}

perClientConnLimit {
  staticReqPerSec         0
  dynReqPerSec            0
  outBandwidth            0
  inBandwidth             0
  softLimit               10000
  hardLimit               10000
  gracePeriod             15
  banPeriod               300
}

CGIRLimit {
  maxCGIInstances         20
  minUID                  11
  minGID                  10
  priority                0
  CPUSoftLimit            10
  CPUHardLimit            50
  memSoftLimit            1460M
  memHardLimit            1470M
  procSoftLimit           400
  procHardLimit           450
}

accessDenyDir {
  dir                     /
  dir                     /etc/*
  dir                     /dev/*
  dir                     conf/*
  dir                     admin/conf/*
}

accessControl {
  allow                   ALL
}

extprocessor lsphp {
  type                    lsapi
  address                 uds://tmp/lshttpd/lsphp.sock
  maxConns                       8
  env                            PHP_LSAPI_CHILDREN=8
  env                            LSAPI_AVOID_FORK=200M
  initTimeout             60
  retryTimeout            0
  persistConn             1
  respBuffer              0
  autoStart               1
  path                    lsphp81/bin/lsphp
  backlog                 100
  instances               1
  priority                0
  memSoftLimit                   1400M
  memHardLimit                   1500M
  procSoftLimit           1400
  procHardLimit           1500
  env                            LSAPI_MAX_REQS=10000
  env                            LSAPI_MAX_IDLE=3600
  env                            LSAPI_ACCEPT_NOTIFY=1
  env                            LSAPI_SLOW_REQ_MSECS=5000
  env                            LSAPI_PGRP_MAX_IDLE=3600
}

scripthandler {
  add                     lsapi:lsphp php
}

railsDefaults {
  maxConns                1
  env                     LSAPI_MAX_IDLE=60
  initTimeout             60
  retryTimeout            0
  pcKeepAliveTimeout      60
  respBuffer              0
  backlog                 50
  runOnStartUp            3
  extMaxIdleTime          300
  priority                3
  memSoftLimit            2047M
  memHardLimit            2047M
  procSoftLimit           500
  procHardLimit           600
}

module cache {
  internal                       1
  checkPublicCache               1
  enableCache                    0
  enablePrivateCache             0
  ignoreRespCacheCtrl            0
  maxCacheObjSize                10000000
  maxStaleAge                    200
}

virtualhost example {
  vhRoot                  /home/example.com/
  configFile              conf/vhosts/example/vhconf.conf
  allowSymbolLink         1
  enableScript            1
  restrained              1
}

listener Default {
  address                 *:8088
  secure                  0
  map                     example *
}
